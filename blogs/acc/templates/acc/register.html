{% extends "base.html" %}
{% load static %}

{% block css_files %}
    <link rel="stylesheet" href="{% static 'acc/css/style.css' %}">
{% endblock %}

{% block title %} Register {% endblock %}

{% block content %}

<div class="container mt-3">
    
    <h1>Register</h1>
    <hr>
    <form action="" method="post">
    {% csrf_token %}
    <div class="mb-4">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" name="username" placeholder="Enter your username" value={{username}}>
    </div>
    <div class="mb-4">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" name="email" placeholder="Enter your email" value={{email}}>
    </div>
    <div class="row mb-4">
<div class="col-md-6">
    <label for="password" class="form-label" class="placeholder">Password</label>
    <input type="password" class="form-control" name="password" placeholder="Enter your password" value={{password}}>
    </div>
    <div class="col-md-6">
    <label for="confirm_password" class="form-label" class="placeholder">Confirm Password</label>
    <input type="password" class="form-control" name="confirm_password" placeholder="Confirm your password" value={{confirm_password}}>
    </div>
    </div>

<div class="mb-4">
    <label for="firstname" class="form-label">First Name</label>
    <input type="text" class="form-control" name="firstname" value={{firstname}}>
    </div>
<div class="mb-4">
    <label for="lastname" class="form-label">Last Name</label>
    <input type="text" class="form-control" name="lastname" value={{lastname}}>
    </div>
    </div> 
    
</div>
<div class="mb-3" ></div>

<div class="text-center">
  <input type="submit" value="Register" class="btn btn-primary">
</div>

    </div>
    </form>

    </form>



</div>

{% endblock %}
{% block js_files %}
    <script src="{% static 'acc/js/base.js' %}"></script>
{% endblock js_files %}
