{% load static %}
<div class="card mb-3">
    <div class="row">
        <div class="col-md-3">
            <img src="{{ blog.image.url }}" class="img-fluid" alt="{{ blog.title }}">
        </div>
        <div class="col-md-9">
            <div class="card-body">
                <!-- href içine eklenmiş doğru kullanım -->
                <a href="{% url 'blog_details' blog.slug %}">
                    <h5 class="card-title">{{ blog.title }}</h5>
                </a>
                <p class="card-text">{{ blog.description }}</p>
            </div>
        </div>
    </div>
</div>
